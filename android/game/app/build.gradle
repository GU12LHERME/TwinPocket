plugins {
    id "com.android.application"
}

// The native code is built BEFORE Gradle by CMake (the android-arm64-game configuration: the game module, the engine and
// the runner as libmain.so; tools/android/build_deps.sh: libSDL2.so). Gradle only packages them with SDL2's Java glue.
//   -Psdl2SourceDir=<SDL release-2.30.9 source>   the Java glue (org.libsdl.app.*) of the same SDL as libSDL2.so
//   -PnativeLibsDir=<dir>                         a jniLibs layout: <dir>/arm64-v8a/{libmain.so,libSDL2.so}
def sdl2SourceDir = providers.gradleProperty("sdl2SourceDir").orNull
if (sdl2SourceDir == null || !file("${sdl2SourceDir}/android-project/app/src/main/java").isDirectory()) {
    throw new GradleException("Pass -Psdl2SourceDir=<SDL release-2.30.9 source directory>")
}
def nativeLibsDir = providers.gradleProperty("nativeLibsDir").orNull
if (nativeLibsDir == null || !file("${nativeLibsDir}/arm64-v8a/libmain.so").isFile()
        || !file("${nativeLibsDir}/arm64-v8a/libSDL2.so").isFile()) {
    throw new GradleException("Pass -PnativeLibsDir=<dir> holding arm64-v8a/libmain.so and arm64-v8a/libSDL2.so")
}

android {
    namespace "org.libsdl.app"
    compileSdk 35

    defaultConfig {
        // the application id since 1.8.1 (previously com.twinsanitypocket.android) (before: com.crashtwinsanity.android, and com.twinsanityevolved.game before that --
        // other apps to Android: their saves come over through Saves -> Exportar / Importar)
        applicationId "com.twinpocket.android"
        manifestPlaceholders = [appLabel: "TwinPocket"]
        minSdk 24
        targetSdk 33
        versionCode 61
        versionName "1.8.1"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // THE SIGNING KEY (since 1.5.0): one fixed key, so that every new APK installs over the previous one (Android refuses an
    // update signed by another certificate). The key never enters the repository: CI writes it from the repository's
    // secrets (TP_KEYSTORE_B64, TP_KEYSTORE_PASSWORD) to a file and names it here with TP_KEYSTORE; the workflow checks the
    // APK's certificate against the key's SHA-256. Without TP_KEYSTORE (a local build) Gradle's own debug key signs.
    def tpKeystore = System.getenv("TP_KEYSTORE")
    signingConfigs {
        if (tpKeystore != null && !tpKeystore.isEmpty()) {
            pocket {
                storeFile file(tpKeystore)
                storePassword System.getenv("TP_KEYSTORE_PASSWORD")
                keyAlias "twinsanitypocket"
                keyPassword System.getenv("TP_KEYSTORE_PASSWORD")
                storeType "pkcs12"
            }
        }
    }
    buildTypes {
        debug {
            if (tpKeystore != null && !tpKeystore.isEmpty()) signingConfig signingConfigs.pocket
        }
        // THE RELEASE BUILD (1.8.0: what CI ships): not debuggable (ART compiles the launcher fully; no run-as into the app's
        // data), signed with the same fixed key as before (new application ID requires save migration), the
        // code not shrunk or obfuscated (R8 off: SDL's Java side is called by name from libSDL2.so through JNI), libmain.so's
        // symbols kept (packagingOptions: crash reports stay readable). A local build without the key signs with the debug key.
        release {
            minifyEnabled false
            shrinkResources false
            if (tpKeystore != null && !tpKeystore.isEmpty()) signingConfig signingConfigs.pocket
            else signingConfig signingConfigs.debug
        }
    }

    // (the release build's lint pass would stop the build on a warning class the debug build never ran; the code is the
    // same as the debug build's, checked by CI's own tests)
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDir "${sdl2SourceDir}/android-project/app/src/main/java"
            jniLibs.srcDirs = [nativeLibsDir]
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ["**/libmain.so"]
        }
    }
}
