plugins {
    id "com.android.application"
}

def sdl2SourceDir = providers.gradleProperty("sdl2SourceDir").orNull
if (sdl2SourceDir == null || !file("${sdl2SourceDir}/CMakeLists.txt").isFile()) {
    throw new GradleException("Pass -Psdl2SourceDir=<SDL release-2.30.9 source directory>")
}

android {
    namespace "org.libsdl.app"
    compileSdk 35
    ndkVersion "30.0.16248370"

    defaultConfig {
        applicationId "com.twinsanityevolved.androidsmoke"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DSDL2_SOURCE_DIR=${sdl2SourceDir}", "-DANDROID_STL=c++_static"
                targets "main"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.31.6"
        }
    }

    sourceSets {
        main {
            java.srcDir "${sdl2SourceDir}/android-project/app/src/main/java"
            res.srcDir "${sdl2SourceDir}/android-project/app/src/main/res"
        }
    }
}
