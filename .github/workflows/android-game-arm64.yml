name: Android ARM64 game build (stage 1 + diagnostics)

# Stage 1 of the Android plan: the REAL code for Android arm64-v8a -- the game module (the decompilation compiled to
# wasm32 by the pinned wasi-sdk and lowered to C by wabt's wasm2c on this machine, then compiled by the NDK), the
# NativeEE engine (configured for Android: engine/platform's Linux folder, the AArch64 fibers, OpenGL ES 3.2) and the
# runner -- linked as libmain.so with every symbol resolved (-Wl,--no-undefined), checked for the components' symbols,
# and packaged with libSDL2.so and SDL2's Java glue as an APK (android/game). The build does not run the game: no device
# here and no disc image (game data is never in the repository or the APK; tools/ci/asset_scan.py).

on:
  workflow_dispatch:
  push:
    branches:
      - android-game-arm64

permissions:
  contents: read

concurrency:
  group: android-game-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game-apk:
    name: Game module + engine + runner -> libmain.so -> APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ANDROID_NDK_VERSION: 30.0.16248370
      ANDROID_API: '24'
      SDL2_REF: release-2.30.9
      LOG_DIR: ${{ github.workspace }}/android-game-logs
      DEPS_DIR: ${{ github.workspace }}/build-android-deps
      BUILD_DIR: ${{ github.workspace }}/build-android-arm64-game

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h "$GITHUB_WORKSPACE"
          mkdir -p "$LOG_DIR"

      - name: Asset scan over the tree (no game data)
        shell: bash
        run: python3 tools/ci/asset_scan.py 2>&1 | tee "$LOG_DIR/asset-scan-tree.log"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Install Android SDK, CMake, NDK and host tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.6" "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          ndk_home="${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ndk_home}" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT}/cmake/3.31.6/bin" >> "$GITHUB_PATH"
          echo "NDK_LLVM=${ndk_home}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ninja-build qemu-user g++-aarch64-linux-gnu glslang-tools > /dev/null

      - name: Record tool versions
        shell: bash
        run: |
          set -euo pipefail
          {
            java -version 2>&1
            gradle --version
            cmake --version
            ninja --version
            python3 --version
            "$NDK_LLVM/clang" --version
          } 2>&1 | tee "$LOG_DIR/tool-versions.log"

      - name: Fetch the pinned wasm toolchain (wasi-sdk 24, wabt 1.0.42)
        shell: bash
        run: tools/fetch_toolchain.sh 2>&1 | tee "$LOG_DIR/fetch-toolchain.log"

      - name: Check out SDL2 (the engine's pin) for libSDL2.so and the Java glue
        uses: actions/checkout@v7
        with:
          repository: libsdl-org/SDL
          ref: release-2.30.9
          path: .deps/SDL2

      - name: AArch64 fiber switch (engine) under qemu-aarch64
        shell: bash
        run: |
          set -euo pipefail
          aarch64-linux-gnu-g++ -std=c++17 -O2 -Wall -Wextra -Werror -static -Iengine \
            engine/tests/android/test_fiber_android_arm64.cpp engine/engine/platform/posix/fiber_android_arm64.cpp \
            -o "$RUNNER_TEMP/test_fiber_android_arm64"
          qemu-aarch64 "$RUNNER_TEMP/test_fiber_android_arm64" 2>&1 | tee "$LOG_DIR/fiber-test.log"

      - name: Game fiber (runner) and the Android game-stack layout under qemu-aarch64
        shell: bash
        run: |
          set -euo pipefail
          aarch64-linux-gnu-gcc -std=gnu99 -O2 -static -Irunner runner/te_fiber_test.c runner/te_fiber.c runner/te_fiber_switch.S \
            -o "$RUNNER_TEMP/te_fiber_test"
          qemu-aarch64 "$RUNNER_TEMP/te_fiber_test" 2>&1 | tee "$LOG_DIR/runner-fiber-test.log"
          aarch64-linux-gnu-gcc -std=gnu99 -O1 -Wall -Wextra -static -Irunner tools/android/test_game_stack_bounds.c \
            runner/te_fiber.c runner/te_fiber_switch.S -o "$RUNNER_TEMP/test_game_stack_bounds" -lpthread
          qemu-aarch64 "$RUNNER_TEMP/test_game_stack_bounds" 2>&1 | tee "$LOG_DIR/game-stack-bounds.log"

      - name: Audio ring lead for the Android device buffers (1024 / 2048 / 4096 frames)
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O1 -Wall -Wextra -Iengine tools/android/test_audio_ring_lead.cpp \
            engine/engine/platform/sdl/audio_pull_ring.cpp -o "$RUNNER_TEMP/test_audio_ring_lead"
          "$RUNNER_TEMP/test_audio_ring_lead" 2>&1 | tee "$LOG_DIR/audio-ring-lead.log"

      - name: Settings defaults (bilinear on Android) and the texture filter row's write read back
        shell: bash
        run: |
          set -euo pipefail
          src="engine/engine/core/config/config.cpp engine/engine/core/config/config_loader.cpp engine/engine/core/config/config_validator.cpp
               engine/engine/core/config/deterministic_profile.cpp engine/engine/core/config/settings_file.cpp
               engine/engine/core/config/mods_config.cpp engine/engine/core/hash/hash.cpp"
          clang++ -std=c++20 -O1 -Iengine -I. -DTE_DEFAULTS_ANDROID tools/android/test_settings_defaults.cpp $src -o "$RUNNER_TEMP/test_settings_android"
          clang++ -std=c++20 -O1 -Iengine -I. tools/android/test_settings_defaults.cpp $src -o "$RUNNER_TEMP/test_settings_desktop"
          "$RUNNER_TEMP/test_settings_android" "$RUNNER_TEMP/settings-a.ini" 2>&1 | tee "$LOG_DIR/settings-defaults.log"
          "$RUNNER_TEMP/test_settings_desktop" "$RUNNER_TEMP/settings-d.ini" 2>&1 | tee -a "$LOG_DIR/settings-defaults.log"

      - name: Level of detail choice (the draw distance; the game's own choice at original)
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O1 -Wall -Wextra -I. -Iplatform/nativeee tools/android/test_lod_choice.cpp -o "$RUNNER_TEMP/test_lod_choice"
          "$RUNNER_TEMP/test_lod_choice" 2>&1 | tee "$LOG_DIR/lod-choice.log"

      - name: Glyph texels (the menus' text under bilinear, no neighbouring column between words)
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O1 -Wall -Wextra -Iplatform/nativeee/host tools/android/test_glyph_texels.cpp -o "$RUNNER_TEMP/test_glyph_texels"
          "$RUNNER_TEMP/test_glyph_texels" 2>&1 | tee "$LOG_DIR/glyph-texels.log"

      - name: Game vibration player (bounded effects, no duplicates, stop on suspend)
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O1 -Wall -Wextra -Iplatform/nativeee/host tools/android/test_rumble_core.cpp -o "$RUNNER_TEMP/test_rumble_core"
          "$RUNNER_TEMP/test_rumble_core" 2>&1 | tee "$LOG_DIR/rumble-core.log"

      - name: Launcher navigation (repeat, stick hysteresis, selection, tabs, START guard)
        shell: bash
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/nav" android/game/app/src/main/java/com/twinsanityevolved/game/Nav.java tools/android/TestNav.java
          java -cp "$RUNNER_TEMP/nav" com.twinsanityevolved.game.TestNav 2>&1 | tee "$LOG_DIR/launcher-nav.log"

      - name: Guarded game memory (every out-of-range access faults, as the checked build trapped)
        shell: bash
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O1 -D__ANDROID__=1 -Iengine tools/android/test_guarded_memory.cpp engine/engine/ee/mem/main_memory.cpp -o "$RUNNER_TEMP/test_guarded_memory"
          "$RUNNER_TEMP/test_guarded_memory" 2>&1 | tee "$LOG_DIR/guarded-memory.log"

      - name: Save manager (listing, export / import round trip, refused archives)
        shell: bash
        run: |
          set -euo pipefail
          javac -encoding UTF-8 -d "$RUNNER_TEMP/saves" android/game/app/src/main/java/com/twinsanityevolved/game/SaveManager.java tools/android/TestSaves.java
          java -cp "$RUNNER_TEMP/saves" com.twinsanityevolved.game.TestSaves 2>&1 | tee "$LOG_DIR/save-manager.log"

      - name: CHD disc images (libchdr at the pinned commit) against the same image as an ISO
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/libchdr"
          git clone -q https://github.com/rtissera/libchdr.git "$src"
          git -C "$src" checkout -q 47d794151b2b64f6aba60304e6480f4f5a2bc24b
          cmake -S "$src" -B "$src/build" -DBUILD_SHARED_LIBS=OFF -DCHDR_WANT_TESTS=OFF -DCMAKE_BUILD_TYPE=Release > /dev/null
          cmake --build "$src/build" --target chdr-static -j 4 > /dev/null
          libs="$(find "$src/build" -name '*.a' | sort -r | tr '\n' ' ')"
          clang++ -std=c++20 -O1 -Wall -DTE_HAVE_CHDR=1 -I. -Iengine -I"$src/include" tools/android/test_disc_chd.cpp \
            platform/nativeee/host/disc_image.cpp engine/engine/cdvd/iso_fs.cpp $libs -lpthread -o "$RUNNER_TEMP/test_disc_chd"
          "$RUNNER_TEMP/test_disc_chd" "$RUNNER_TEMP" 2>&1 | tee "$LOG_DIR/disc-chd.log"

      - name: The engine's shaders as GLSL ES 3.20 (gl_glsl_es.cpp) through glslangValidator
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/glsl-es"
          mkdir -p "$out"
          clang++ -std=c++17 -O1 -Iengine tools/android/glsl_es_check.cpp engine/engine/render/backends/gl/gl_glsl_es.cpp \
            engine/engine/render/backends/gl/gl_shader_sources.cpp -o "$RUNNER_TEMP/glsl_es_check"
          "$RUNNER_TEMP/glsl_es_check" "$out" > /dev/null
          fail=0
          for f in "$out"/*; do
            if glslangValidator "$f" > "$f.log" 2>&1; then echo "PASS  GLSL ES 3.20: $(basename "$f")"
            else echo "FAIL  GLSL ES 3.20: $(basename "$f")"; grep -E 'ERROR' "$f.log" | head -10; fail=1; fi
          done 2>&1 | tee "$LOG_DIR/glsl-es-check.log"
          ! grep -q '^FAIL' "$LOG_DIR/glsl-es-check.log"

      - name: Build SDL2 (shared) and FFmpeg (static, LGPL) for arm64-v8a
        shell: bash
        run: |
          set -euo pipefail
          tools/android/build_deps.sh "$GITHUB_WORKSPACE/.deps/SDL2" "$DEPS_DIR" 2>&1 | tee "$LOG_DIR/deps.log"

      - name: Configure (android-arm64-game)
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset android-arm64-game \
            -DTE_ANDROID_SDL2_DIR="$DEPS_DIR/sdl2/lib/cmake/SDL2" \
            -DTE_ANDROID_FFMPEG_PREFIX="$DEPS_DIR/ffmpeg" 2>&1 | tee "$LOG_DIR/configure.log"

      - name: Build the engine for Android (NativeEE archives)
        shell: bash
        run: |
          set -euo pipefail
          if ! cmake --build "$BUILD_DIR" --target nativeee > "$LOG_DIR/build-engine.log" 2>&1; then
            tail -n 30 "$LOG_DIR/build-engine.log"
            if [ -f "$BUILD_DIR/engine/build.ninja" ]; then
              # keep going: every engine error of this commit in one pass
              ninja -C "$BUILD_DIR/engine" -k 0 $(tr ';' ' ' < "$BUILD_DIR/te_engine_targets.txt") > "$LOG_DIR/build-engine-keep-going.log" 2>&1 || true
              grep -E 'error:|undefined reference|FAILED:' "$LOG_DIR/build-engine-keep-going.log" | sort -u | head -200
            fi
            exit 1
          fi
          tail -n 5 "$LOG_DIR/build-engine.log"

      - name: Build the game module, the runner and libmain.so
        shell: bash
        run: |
          set -euo pipefail
          t0=$(date +%s)
          if ! cmake --build --preset android-arm64-game -- -k 0 > "$LOG_DIR/build-game.log" 2>&1; then
            grep -E 'error:|undefined (reference|symbol)|FAILED:' "$LOG_DIR/build-game.log" | sort -u | head -200
            tail -n 30 "$LOG_DIR/build-game.log"; exit 1
          fi
          tail -n 5 "$LOG_DIR/build-game.log"
          test -s "$BUILD_DIR/libmain.so"
          echo "MEASURE  game build (module + runner + libmain.so): $(( $(date +%s) - t0 )) s, w2c flags: $(grep -E '^TE_ANDROID_W2C_FLAGS' "$BUILD_DIR/CMakeCache.txt" | cut -d= -f2)" | tee "$LOG_DIR/measurements.txt"

      - name: Verify libmain.so (ELF, dependencies, the components' symbols)
        shell: bash
        run: |
          set -euo pipefail
          so="$BUILD_DIR/libmain.so"
          ev="$LOG_DIR/libmain-evidence.txt"
          : > "$ev"
          fail=0
          check() {   # check <label> <min count> <regex>   (over the demangled symbol table)
            local n
            n="$(grep -cE "$3" "$LOG_DIR/libmain-symbols.txt" || true)"
            if [ "$n" -ge "$2" ]; then echo "PASS  $1: $n symbols match /$3/" | tee -a "$ev"
            else echo "FAIL  $1: $n symbols match /$3/ (expected >= $2)" | tee -a "$ev"; fail=1; fi
          }
          {
            echo "== file"; ls -l "$so"; sha256sum "$so"
            echo "== ELF header"; "$NDK_LLVM/llvm-readelf" -h "$so"
            echo "== dynamic section"; "$NDK_LLVM/llvm-readelf" -d "$so"
            echo "== section sizes"; "$NDK_LLVM/llvm-size" -A "$so" | sort -k2 -n -r | head -20
          } > "$LOG_DIR/libmain-elf.txt"
          "$NDK_LLVM/llvm-nm" -C --defined-only "$so" > "$LOG_DIR/libmain-symbols.txt"
          "$NDK_LLVM/llvm-nm" -D --undefined-only "$so" > "$LOG_DIR/libmain-undefined-dynamic.txt"
          grep -q 'Class:.*ELF64' "$LOG_DIR/libmain-elf.txt" && grep -q 'Machine:.*AArch64' "$LOG_DIR/libmain-elf.txt" \
            && echo "PASS  ELF64 AArch64 shared object" | tee -a "$ev" || { echo "FAIL  not an ELF64 AArch64 object" | tee -a "$ev"; fail=1; }
          for lib in libSDL2.so libGLESv3.so libEGL.so liblog.so; do
            if grep -q "Shared library: \[$lib\]" "$LOG_DIR/libmain-elf.txt"; then echo "PASS  NEEDED $lib" | tee -a "$ev"
            else echo "FAIL  NEEDED $lib missing" | tee -a "$ev"; fail=1; fi
          done
          if grep -q 'libc++_shared' "$LOG_DIR/libmain-elf.txt"; then echo "FAIL  links libc++_shared (expected the static C++ runtime)" | tee -a "$ev"; fail=1; fi
          { echo "== libmain.so"; ls -l "$so" | awk '{print $5" bytes"}'; sha256sum "$so" | awk '{print "sha256 "$1}'
            grep -E 'NEEDED|SONAME' "$LOG_DIR/libmain-elf.txt"
            grep -E '^\s*\.(text|rodata|data|bss) ' "$LOG_DIR/libmain-elf.txt" || true; } | tee -a "$ev"
          echo "== components" | tee -a "$ev"
          check "entry: SDL_main (runner/te_android.cpp)"                 1   ' T SDL_main$'
          check "runner main (runner/main.cpp as te_runner_main)"         1   'te_runner_main'
          check "runner: game fiber switch (runner/te_fiber_switch.S)"     1   ' te_fiber_switch$'
          check "game module: wasm2c functions (w2c_game_*)"               5000 'w2c_game_'
          check "game module: instantiation (wasm2c_game_instantiate)"      1   'wasm2c_game_instantiate'
          check "game module: wasm2c runtime (wasm_rt_*)"                  5    'wasm_rt_'
          check "seam: host thunks / ps2e_* bodies"                        50   'ps2e_'
          check "engine: OpenGL ES backend (ps2r::*Gl*)"                   20   'ps2r::.*Gl[A-Z]'
          check "engine: AArch64 fibers (posix/fiber_android_arm64.cpp)"   2    'ps2r_fiber_a64_switch|FiberPosix::Create'
          check "engine: SDL input system"                                  5    'InputSystem'
          check "engine: SDL audio sink"                                    2    'SdlAudioSink'
          check "engine: disc image file system (cdvd IsoFs / DiscOverlay)" 5    ' (IsoFs|DiscOverlay)::'
          check "engine: sound (SPU2 mixer / VAG decoder)"                  5    'ps2r::sound::'
          check "engine: GS texture formats / transfers"                    5    'ps2r::gs'
          check "host seam: disc reader (platform/nativeee/host te::io)"     5    'te::io::'
          check "engine: title HLE (Crash Twinsanity)"                     5    'title'
          check "FFmpeg: MPEG-2 decoder (movies)"                           1    'ff_mpeg2video_decoder'
          check "diagnostics: start-up stages (runner/te_android_diag.cpp)" 1    ' te_android_stage$'
          check "diagnostics: exit() wrapper (-Wl,--wrap=exit)"             1    ' __wrap_exit$'
          check "diagnostics: JNI probe (TeDiag.nativeProbe)"               1    'Java_com_twinsanityevolved_game_TeDiag_nativeProbe'
          check "game stack inside the game thread (te_android_take_fiber_stack)" 1 'te_android_take_fiber_stack'
          check "crash backtrace unwinder callback (te_android_diag.cpp)"     1    'CollectCrashFrame'
          # (IsSensor is inlined: its log text is the evidence that the sensor refusal is linked in)
          "$NDK_LLVM/llvm-strings" "$so" > "$LOG_DIR/libmain-strings.txt"
          if grep -q 'is a sensor, not a pad: ignored' "$LOG_DIR/libmain-strings.txt"; then echo "PASS  input: sensors refused as pads (gamepad_backend.cpp IsSensor, its log text linked)" | tee -a "$ev"
          else echo "FAIL  input: the sensor refusal is not in libmain.so" | tee -a "$ev"; fail=1; fi
          check "input: stick log (GamepadBackend::LogSticks)"              1    'GamepadBackend::LogSticks'
          check "audio: configurable device buffer (RequestedBufferFrames)" 1    'SdlAudioSink::RequestedBufferFrames'
          check "audio: device callback timing (SdlAudioSink::Stats)"      1    'SdlAudioSink::Stats'
          check "graphics: OpenGL ES driver messages (InstallEsDiagnostics)" 1  'InstallEsDiagnostics'
          check "graphics: on-demand draw capture (te_graphics_request_capture)" 1 'te_graphics_request_capture'
          check "graphics: texture info for the capture (ps2e_draw_texture_info)" 1 'ps2e_draw_texture_info'
          echo "== dynamic symbol table entries for the Java entry points (llvm-readelf --dyn-syms)" | tee -a "$ev"
          "$NDK_LLVM/llvm-readelf" --dyn-syms --wide "$so" | grep -E 'SDL_main|TeDiag|JNI_OnLoad' | tee -a "$ev" || echo "(none)" | tee -a "$ev"
          echo "== the same symbols in the full table (llvm-nm, any binding)" | tee -a "$ev"
          "$NDK_LLVM/llvm-nm" "$so" | grep -E ' SDL_main$|TeDiag_nativeProbe$' | tee -a "$ev" || true
          echo "== dynamic symbols defined: $("$NDK_LLVM/llvm-nm" -D --defined-only "$so" | wc -l)" | tee -a "$ev"
          # (read into a file first: `nm | grep -q` under pipefail fails on nm's SIGPIPE when grep stops early)
          "$NDK_LLVM/llvm-nm" -D --defined-only "$so" > "$LOG_DIR/libmain-dynamic-defined.txt"
          n="$(grep -cE ' T (SDL_main|Java_com_twinsanityevolved_game_TeDiag_nativeProbe)$' "$LOG_DIR/libmain-dynamic-defined.txt" || true)"
          if [ "$n" -eq 2 ]; then echo "PASS  exported to Java (dynamic symbols): SDL_main and TeDiag.nativeProbe" | tee -a "$ev"
          else echo "FAIL  $n of SDL_main / TeDiag.nativeProbe exported" | tee -a "$ev"; fail=1; fi
          if grep -q 'init_array' <("$NDK_LLVM/llvm-readelf" -S "$so"); then echo "PASS  .init_array present (the early diagnostics constructor)" | tee -a "$ev"; fi
          echo "== engine namespaces linked (symbol count per ps2r:: namespace)" | tee -a "$ev"
          grep -oE 'ps2r::[a-z0-9_]+' "$LOG_DIR/libmain-symbols.txt" | sort | uniq -c | sort -rn | tee -a "$ev"
          echo "== undefined dynamic symbols resolved by NEEDED libraries: $(wc -l < "$LOG_DIR/libmain-undefined-dynamic.txt")" | tee -a "$ev"
          echo "== total defined symbols: $(wc -l < "$LOG_DIR/libmain-symbols.txt")" | tee -a "$ev"
          exit $fail

      - name: Package the APK (android/game)
        shell: bash
        run: |
          set -euo pipefail
          jni="$RUNNER_TEMP/jniLibs"
          mkdir -p "$jni/arm64-v8a"
          # Etapa 5: the APK's libmain.so without its DWARF debug sections (llvm-strip --strip-debug): the symbol table
          # (.symtab) and the dynamic symbols stay, so the launcher's crash symbolizer (Diag.symbolizeFrames) and dladdr
          # still name the functions; the full libmain.so (with DWARF) is in the artifact for offline debugging
          "$NDK_LLVM/llvm-strip" --strip-debug -o "$jni/arm64-v8a/libmain.so" "$BUILD_DIR/libmain.so"
          # libSDL2.so likewise without DWARF (its symbols kept)
          "$NDK_LLVM/llvm-strip" --strip-debug -o "$jni/arm64-v8a/libSDL2.so" "$DEPS_DIR/sdl2/lib/libSDL2.so"
          echo "MEASURE  libSDL2.so built: $(stat -c %s "$DEPS_DIR/sdl2/lib/libSDL2.so") bytes; in the APK (debug sections stripped): $(stat -c %s "$jni/arm64-v8a/libSDL2.so") bytes" | tee -a "$LOG_DIR/measurements.txt"
          "$NDK_LLVM/llvm-readelf" -S "$jni/arm64-v8a/libmain.so" > "$LOG_DIR/libmain-apk-sections.txt"
          grep -q ' \.symtab ' "$LOG_DIR/libmain-apk-sections.txt" || { echo "FAIL  the APK's libmain.so lost .symtab"; exit 1; }
          if grep -q ' \.debug_' "$LOG_DIR/libmain-apk-sections.txt"; then echo "FAIL  DWARF left in the APK's libmain.so"; exit 1; fi
          echo "PASS  the APK's libmain.so: .symtab kept (crash symbolizer), DWARF removed" | tee -a "$LOG_DIR/libmain-evidence.txt"
          {
            echo "MEASURE  libmain.so built: $(stat -c %s "$BUILD_DIR/libmain.so") bytes; in the APK (debug sections stripped): $(stat -c %s "$jni/arm64-v8a/libmain.so") bytes"
            echo "MEASURE  libmain.so sections (built):"
            "$NDK_LLVM/llvm-size" -A "$BUILD_DIR/libmain.so" | awk 'NR>2 && $2>1000000 {printf "           %-22s %12d\n", $1, $2}'
          } | tee -a "$LOG_DIR/measurements.txt"
          gradle --no-daemon --stacktrace -p android/game assembleDebug \
            -Psdl2SourceDir="$GITHUB_WORKSPACE/.deps/SDL2" -PnativeLibsDir="$jni" 2>&1 | tee "$LOG_DIR/gradle-build.log"

      - name: Verify the APK (package, native code, no game data)
        shell: bash
        run: |
          set -euo pipefail
          apk="android/game/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt" dump badging "$apk" | tee "$LOG_DIR/apk-badging.log"
          grep -q "package: name='com.crashtwinsanity.android'" "$LOG_DIR/apk-badging.log"
          grep -q "native-code: 'arm64-v8a'" "$LOG_DIR/apk-badging.log"
          grep -q "launchable-activity: name='com.twinsanityevolved.game.LauncherActivity'" "$LOG_DIR/apk-badging.log"
          echo "PASS  the launcher icon opens LauncherActivity (Java only; the game runs in the :game process)" | tee -a "$LOG_DIR/libmain-evidence.txt"
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > "$LOG_DIR/apk-manifest.txt"
          grep -q ':game' "$LOG_DIR/apk-manifest.txt" && grep -q ':probe' "$LOG_DIR/apk-manifest.txt" && grep -q 'LogProvider' "$LOG_DIR/apk-manifest.txt"
          echo "PASS  manifest: MainActivity in :game, ProbeActivity in :probe, LogProvider" | tee -a "$LOG_DIR/libmain-evidence.txt"
          unzip -p "$apk" 'classes*.dex' > "$RUNNER_TEMP/classes.dex"
          for cls in LauncherActivity ProbeActivity MainActivity LogProvider Diag TeDiag; do
            grep -aq "com/twinsanityevolved/game/$cls" "$RUNNER_TEMP/classes.dex" || { echo "FAIL  class $cls not in the dex"; exit 1; }
          done
          echo "PASS  dex: LauncherActivity ProbeActivity MainActivity LogProvider Diag TeDiag" | tee -a "$LOG_DIR/libmain-evidence.txt"
          unzip -l "$apk" | tee "$LOG_DIR/apk-contents.log"
          x="$RUNNER_TEMP/apk-x"
          rm -rf "$x"; mkdir -p "$x"; unzip -q "$apk" -d "$x"
          cmp "$x/lib/arm64-v8a/libmain.so" "$RUNNER_TEMP/jniLibs/arm64-v8a/libmain.so"
          cmp "$x/lib/arm64-v8a/libSDL2.so" "$RUNNER_TEMP/jniLibs/arm64-v8a/libSDL2.so"
          "$NDK_LLVM/llvm-objcopy" -O binary "$DEPS_DIR/sdl2/lib/libSDL2.so" "$RUNNER_TEMP/sdl-built.bin"
          "$NDK_LLVM/llvm-objcopy" -O binary "$x/lib/arm64-v8a/libSDL2.so" "$RUNNER_TEMP/sdl-apk.bin"
          cmp "$RUNNER_TEMP/sdl-built.bin" "$RUNNER_TEMP/sdl-apk.bin"
          # the stripped copy is the verified libmain.so less its DWARF: the same code and data bytes (llvm-objcopy's
          # -O binary of the loadable segments compared)
          "$NDK_LLVM/llvm-objcopy" -O binary "$BUILD_DIR/libmain.so" "$RUNNER_TEMP/built.bin"
          "$NDK_LLVM/llvm-objcopy" -O binary "$x/lib/arm64-v8a/libmain.so" "$RUNNER_TEMP/apk.bin"
          cmp "$RUNNER_TEMP/built.bin" "$RUNNER_TEMP/apk.bin"
          echo "PASS  the APK carries the verified libmain.so and libSDL2.so (their loadable bytes identical, DWARF removed)" | tee -a "$LOG_DIR/libmain-evidence.txt"
          {
            echo "MEASURE  APK: $(stat -c %s "$apk") bytes"
            unzip -lv "$apk" | awk '/lib\/arm64-v8a\/|classes.*\.dex/ {printf "MEASURE  in the APK: %-28s %11d bytes, %11d stored\n", $8, $1, $3}'
          } | tee -a "$LOG_DIR/measurements.txt"
          python3 tools/ci/asset_scan.py "$x/lib" 2>&1 | tee "$LOG_DIR/asset-scan-apk.log"
          disc_files="$(find "$x" -type f \( -iname '*.iso' -o -iname '*.bin' -o -iname '*.elf' -o -iname '*.irx' \))"
          if [ -n "$disc_files" ]; then
            echo "FAIL  disc / program files in the APK"; exit 1
          fi
          sha256sum "$apk" | tee "$LOG_DIR/apk-sha256.txt"

      - name: Package the migration APK (the old app id, to export the old app's saves)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-game-out
          cp android/game/app/build/outputs/apk/debug/app-debug.apk android-game-out/CrashTwinsanity.apk
          jni="$RUNNER_TEMP/jniLibs"   # the native libraries the main APK was packaged from
          test -s "$jni/arm64-v8a/libmain.so"
          gradle --no-daemon -p android/game assembleDebug \
            -Psdl2SourceDir="$GITHUB_WORKSPACE/.deps/SDL2" -PnativeLibsDir="$jni" \
            -PappId=com.twinsanityevolved.game -PappLabel="Crash Twinsanity (antigo)" 2>&1 | tail -5 | tee "$LOG_DIR/gradle-migration.log"
          "${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt" dump badging android/game/app/build/outputs/apk/debug/app-debug.apk | grep -E "^package:|application-label:" | tee -a "$LOG_DIR/gradle-migration.log"
          grep -q "package: name='com.twinsanityevolved.game'" "$LOG_DIR/gradle-migration.log"
          cp android/game/app/build/outputs/apk/debug/app-debug.apk android-game-out/CrashTwinsanity-migracao-id-antigo.apk
          ls -la android-game-out

      - name: Upload APK, libmain.so and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-game-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android-game-out/
            build-android-arm64-game/libmain.so
            android-game-logs/
          if-no-files-found: warn
          retention-days: 14
